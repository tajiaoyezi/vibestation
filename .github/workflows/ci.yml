# CI skeleton · Phase 4 建立，Spike W0 后逐步填充真实 job
# 当前状态（2026-04-18 · pre-code）：
#   - Rust / TypeScript 代码尚不存在（Cargo.toml / package.json 在 Spike W0 创建）
#   - 本文件占位 + 文档字段校验 job · 其他 job 作为占位 step 运行 echo
#   - Spike W0 后填充 cargo clippy / cargo test / cargo fmt / pnpm lint / pnpm typecheck
#
# 设计：每个 job 独立 · 失败一个不影响其他 job 继续跑 · 便于 PR 看到完整失败清单
# 超时：每 job ≤ 10min（CI 成本 + 失败反馈速度）
# 2026-04-23：为节省 GitHub Actions 免费时长，关 PR 触发（PR #102）· 只保留 `push main` + `workflow_dispatch`
# 2026-04-25：GitHub Actions billing 失败导致 main push 触发后所有 job fail · 误导未来 agent ·
#             进一步关闭 `push main` 触发 · 仅保留 `workflow_dispatch`（手动触发 / billing 恢复后再放开）

name: CI

on:
  workflow_dispatch:
    inputs:
      release_windows_tag:
        description: "Optional: build Windows installers for this tag and upload them to its GitHub Release"
        required: false
        default: ""
      release_tag:
        description: "Optional: build all release installers for this tag and upload them to its GitHub Release"
        required: false
        default: ""
      release_macos_tag:
        description: "Optional: build only the macOS installer for this tag and upload it to its GitHub Release"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # ────────────── 文档 / Spec 校验（当前阶段唯一实际工作的 job）──────────────
  markdown-lint:
    name: Markdown lint · 文档一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.release_windows_tag == '' && inputs.release_tag == '' && inputs.release_macos_tag == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for trailing whitespace
        run: |
          if grep -rn ' $' --include='*.md' docs/ CLAUDE.md README.md NOTICE 2>/dev/null; then
            echo "::error::Trailing whitespace detected in Markdown files"
            exit 1
          fi
          echo "✓ No trailing whitespace"

      - name: Check for broken internal anchor links（简化版）
        run: |
          # 仅检查明显的坏链接格式（如 [text]() 空 href）
          broken=$(grep -rn '\](\(\))' --include='*.md' docs/ 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::warning::Empty anchor links detected:"
            echo "$broken"
          fi
          echo "✓ No obvious broken anchor links"

  # ────────────── Rust 构建与测试（MVP-01 Phase A 启用 · Task 5.2 跨平台矩阵）──────────────
  rust-build:
    name: Rust · clippy + fmt + test + Tauri build smoke (${{ matrix.os }})
    if: ${{ inputs.release_windows_tag == '' && inputs.release_tag == '' && inputs.release_macos_tag == '' }}
    # Task 5.2 · windows-ci-matrix：把单 job 展开为 ubuntu + windows 两 leg。
    # windows-latest runner 预装 MSVC toolchain + WebView2 Runtime + Node，无需 apt。
    # 触发仍为 workflow_dispatch（ADR-021 · 见文件顶部 on:），矩阵化让手动 dispatch 覆盖 Windows leg。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 40min（原 25）：windows-latest 冷 runner 上可选 NSIS bundle smoke（release 编译 + NSIS 下载打包）
    # 会把 windows leg 推过 25min → job 被 timeout cancelled（run 26638582117 实测）。
    # 门控步 fmt/clippy/test/build smoke 早已通过 · 仅 NSIS 拖尾 · 给足时间让 job 干净 success。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system deps (Tauri on Ubuntu)
        # Ubuntu 专属：Tauri 的 webkit2gtk 等系统依赖；Windows leg 跳过（runner 预装 WebView2）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          # 不缓存 target/：Windows debug+release+NSIS bundle 产物多 GB · post-job cache
          # save 压缩+上传拖过 job timeout → windows leg 被 cancelled（run 26643478610
          # 实测：fmt/clippy/test/build smoke/NSIS 全 success · 仅 "Post Cache" 超时）。
          # registry+git 缓存才是依赖下载的主要加速来源 · target 跨 run 价值有限。
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # ─── Tauri build smoke（Codex adversarial review finding #2）───
      # 验证 tauri.conf.json 的 beforeBuildCommand + frontendDist 路径确实能跑
      # --no-bundle 跳过 dmg/appimage 打包（避免 macOS signing / AppImage tooling）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "pnpm: $(pnpm --version)"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Tauri build smoke (--debug --no-bundle)
        # 会连带跑 beforeBuildCommand: pnpm --filter @vibestation/web build
        # 验证 frontendDist 路径 + pnpm workspace filter + tauri.conf.json 对齐
        # 两 leg 都跑（--no-bundle 跳过打包 · 仅验编译链路 · 不依赖 WiX/NSIS/dmg tooling）
        run: pnpm tauri:build:smoke

      # ─── Windows NSIS bundle smoke（Task 5.2 AC4 · 可选 · 不阻断 build+test gate）───
      # PRD R2 / ADR-021：windows-latest runner 可能缺 WiX/网络下载失败 → continue-on-error 隔离。
      # NSIS toolchain 由 Tauri 自动下载（本机 Windows 实测可产出 .exe）；失败时 job 仍绿。
      - name: Tauri NSIS bundle smoke (Windows · optional)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pnpm tauri:build --config crates/app/tauri.conf.json --bundles nsis

  # ────────────── Frontend 构建与测试（MVP-01 Phase A 启用）──────────────
  frontend-build:
    name: Frontend · pnpm lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.release_windows_tag == '' && inputs.release_tag == '' && inputs.release_macos_tag == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Enable pnpm 9.15.9 via corepack
        # Node 内建 corepack · 显式 activate pnpm@9.15.9（和 package.json
        # packageManager 字段完全一致 · 避免 pnpm/action-setup@v6 版本识别歧义
        # 历史：v6 在 runner 上实测会 fallback 到 runner 预装旧版本 pnpm ·
        # 把 lockfileVersion: '9.0' 解析成 broken（expected a single document）。
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "pnpm version: $(pnpm --version)"
          echo "node version: $(node --version)"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm lint (prettier check)
        run: pnpm lint

      - name: pnpm typecheck
        run: pnpm typecheck

      # Codex adversarial review finding #2：验证 web 能真的 bundle
      # （pnpm tauri build smoke 在 rust-build job 再跑一次 end-to-end · 此处快路径先拦截前端打包 bug）
      - name: pnpm build (web bundle smoke)
        run: pnpm --filter @vibestation/web build

  # ────────────── Runtime evidence validator（session 28 PR #273 工具 + PR #279 exception）──────────────
  runtime-evidence-validator:
    name: Runtime evidence · R1-R5 + .validator-exceptions.json
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ inputs.release_windows_tag == '' && inputs.release_tag == '' && inputs.release_macos_tag == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run runtime-evidence validator
        # 扫 docs/runtime-evidence/<task-id>/ 25 目录（截至 session 28）·
        # R1 命名 / R2 git tracked / R3 顺序前缀 / R4 体积 ≤ 10MB · 单文件 + 总和 ·
        # spec-mandated 命名 / 历史超体积 via .validator-exceptions.json 豁免 ·
        # PR #279 加 11 vitest case · 当前 baseline: 21 PASS / 4 WARNING / 0 ERROR
        run: node scripts/validate-runtime-evidence.mjs

      - name: Run validator vitest unit tests
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @vibestation/web exec vitest run tests/scripts/validate-runtime-evidence.test.ts

  # ────────────── 占位 placeholder（pre-code 状态指示器）──────────────
  pre-code-status:
    name: Pre-code status · 当前阶段说明
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: ${{ inputs.release_windows_tag == '' && inputs.release_tag == '' && inputs.release_macos_tag == '' }}
    steps:
      - name: Status
        run: |
          echo "📌 MVP-01 Phase A · CI active"
          echo "   · markdown-lint: active"
          echo "   · rust-build: active（cargo clippy + fmt + test）"
          echo "   · frontend-build: active（pnpm lint + typecheck）"
          echo "   · runtime-evidence-validator: active (session 28 PR #273 + #279)"
          echo "   · secret-scan: active (see .github/workflows/secret-scan.yml)"
          echo "   · task-spec-validator: active (see .github/workflows/task-spec-validator.yml)"
          echo ""
          echo "See: docs/BRANCH-PROTECTION.md for required-checks config guide."

  release-windows-installers:
    name: Release · Windows NSIS + MSI installers
    runs-on: windows-latest
    timeout-minutes: 60
    if: ${{ inputs.release_windows_tag != '' || inputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || inputs.release_windows_tag }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS and MSI installers
        run: pnpm exec tauri build --config crates/app/tauri.conf.json --bundles nsis --bundles msi

      - name: List installer assets
        shell: pwsh
        run: |
          Get-ChildItem -Path target/release/bundle -Recurse -File |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload installers to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_windows_tag }}
        run: |
          $assets = @(
            Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          )
          if ($assets.Count -eq 0) {
            throw "No Windows installer assets were produced"
          }
          $assetPaths = $assets | ForEach-Object { $_.FullName }
          & gh release upload $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --clobber

  release-macos-installers:
    name: Release · macOS DMG installer
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ inputs.release_tag != '' || inputs.release_macos_tag != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || inputs.release_macos_tag }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG installer
        run: pnpm exec tauri build --config crates/app/tauri.conf.json --bundles dmg

      - name: List installer assets
        run: find target/release/bundle -type f -print

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.release_macos_tag }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find target/release/bundle/dmg -type f -name '*.dmg' -print0 2>/dev/null)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No macOS DMG assets were produced"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  release-linux-installers:
    name: Release · Linux AppImage + DEB installers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ inputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage and DEB installers
        run: pnpm exec tauri build --config crates/app/tauri.conf.json --bundles appimage --bundles deb

      - name: List installer assets
        run: find target/release/bundle -type f -print

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 2>/dev/null)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No Linux installer assets were produced"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
