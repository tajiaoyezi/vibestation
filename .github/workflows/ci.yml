# CI skeleton · Phase 4 建立，Spike W0 后逐步填充真实 job
# 当前状态（2026-04-18 · pre-code）：
#   - Rust / TypeScript 代码尚不存在（Cargo.toml / package.json 在 Spike W0 创建）
#   - 本文件占位 + 文档字段校验 job · 其他 job 作为占位 step 运行 echo
#   - Spike W0 后填充 cargo clippy / cargo test / cargo fmt / pnpm lint / pnpm typecheck
#
# 设计：每个 job 独立 · 失败一个不影响其他 job 继续跑 · 便于 PR 看到完整失败清单
# 超时：每 job ≤ 10min（CI 成本 + 失败反馈速度）

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────── 文档 / Spec 校验（当前阶段唯一实际工作的 job）──────────────
  markdown-lint:
    name: Markdown lint · 文档一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: contains(github.event.pull_request.changed_files, 'md') || true  # 当前总是跑
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if grep -rn ' $' --include='*.md' docs/ CLAUDE.md README.md NOTICE 2>/dev/null; then
            echo "::error::Trailing whitespace detected in Markdown files"
            exit 1
          fi
          echo "✓ No trailing whitespace"

      - name: Check for broken internal anchor links（简化版）
        run: |
          # 仅检查明显的坏链接格式（如 [text]() 空 href）
          broken=$(grep -rn '\](\(\))' --include='*.md' docs/ 2>/dev/null || true)
          if [ -n "$broken" ]; then
            echo "::warning::Empty anchor links detected:"
            echo "$broken"
          fi
          echo "✓ No obvious broken anchor links"

  # ────────────── Rust 构建与测试（MVP-01 Phase A 启用）──────────────
  rust-build:
    name: Rust · cargo clippy + fmt + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (Tauri on Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # ────────────── Frontend 构建与测试（MVP-01 Phase A 启用）──────────────
  frontend-build:
    name: Frontend · pnpm lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enable pnpm 9.15.9 via corepack
        # Node 内建 corepack · 显式 activate pnpm@9.15.9（和 package.json
        # packageManager 字段完全一致 · 避免 pnpm/action-setup@v6 版本识别歧义
        # 历史：v6 在 runner 上实测会 fallback 到 runner 预装旧版本 pnpm ·
        # 把 lockfileVersion: '9.0' 解析成 broken（expected a single document）。
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          echo "pnpm version: $(pnpm --version)"
          echo "node version: $(node --version)"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm lint (prettier check)
        run: pnpm lint

      - name: pnpm typecheck
        run: pnpm typecheck

  # ────────────── 占位 placeholder（pre-code 状态指示器）──────────────
  pre-code-status:
    name: Pre-code status · 当前阶段说明
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Status
        run: |
          echo "📌 MVP-01 Phase A · CI active"
          echo "   · markdown-lint: active"
          echo "   · rust-build: active（cargo clippy + fmt + test）"
          echo "   · frontend-build: active（pnpm lint + typecheck）"
          echo "   · secret-scan: active (see .github/workflows/secret-scan.yml)"
          echo "   · task-spec-validator: active (see .github/workflows/task-spec-validator.yml)"
          echo ""
          echo "See: docs/BRANCH-PROTECTION.md for required-checks config guide."
