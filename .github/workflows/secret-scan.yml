# Secret scan · gitleaks
# 触发：PR + push 到 main
# 来源：SPIKE-06 §A.5.3（Phase 4 依赖）· Codex PR #7 F4 / PR #10 F4 复核
# 目的：防止 auth token / API key / JWT / session cookie / PII 泄漏到 repo

name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 允许手动触发（审查 SPIKE-06 样本 commit 前手动跑）
  workflow_dispatch:

# 权限最小化
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # 3 分钟超时（扫 spec + 脱敏样本应该够）
    timeout-minutes: 3
    steps:
      - name: Checkout (fetch full history for PR diff scan)
        uses: actions/checkout@v4
        with:
          # full history 让 gitleaks 能扫 PR 的所有 commit（不只 HEAD）
          fetch-depth: 0

      - name: gitleaks · pre-merge secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # 无需 paid license · 公开 repo + free action
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # 如未来接入 org license 再启用
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # config 文件预留（当前为空 · false positive 出现后再加规则）
          # config-path: .gitleaks.toml
          # Phase 2 / Phase 3 不建 .gitleaks.toml（per SPIKE-06 A.5.3）
          # 先用 gitleaks 默认规则集
          version: "latest"

      # 可选：提交扫描报告为 artifact（便于 review · 仅 fail 时上传）
      - name: Upload gitleaks report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────
# 如何禁用（**严格禁止** 未经用户授权禁用）
#
# 1. 本 workflow 是 SPIKE-06 §A.5.3 硬阻塞的落地实现。关闭 = R1 样本泄漏风险。
# 2. 如出现 false positive：
#    (a) 先人工确认确实是误报（不是真 secret）
#    (b) 在 commit 对应位置加行内 `# gitleaks:allow` 注释（gitleaks 原生忽略机制）
#    (c) 若需全局精准 allow → 创建 `.gitleaks.toml` 加最小范围规则（不得整体 disable rule type）
# 3. 紧急场景（CI 已阻塞但需要 hotfix）：
#    (a) 找 maintainer 临时 skip（GitHub 分支保护里 "Allow administrators to bypass" 开启时可用）
#    (b) merge 后立即修 + 补跑扫描
# ─────────────────────────────────────────────────────────────────────
