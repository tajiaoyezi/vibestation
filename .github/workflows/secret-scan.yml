# Secret scan · gitleaks + inline-bypass guard
# 触发：push 到 main + 手动触发
# 来源：SPIKE-06 §A.5.3（Phase 4 依赖）· Codex PR #7 F4 / PR #10 F4 / PR #11 F3 复核
# 目的：防止 auth token / API key / JWT / session cookie / PII 泄漏到 repo ·
#       同时防止 gitleaks:allow 内联绕过（Codex PR #11 F3 教训）

name: Secret Scan

on:
  push:
    branches: [main]
  # 允许手动触发（审查 SPIKE-06 样本 commit 前手动跑）
  workflow_dispatch:

# 权限最小化
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # 3 分钟超时（扫 spec + 脱敏样本应该够）
    timeout-minutes: 3
    steps:
      - name: Checkout (fetch full history for PR diff scan)
        uses: actions/checkout@v6
        with:
          # full history 让 gitleaks 能扫 PR 的所有 commit（不只 HEAD）
          fetch-depth: 0

      - name: gitleaks · pre-merge secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # 无需 paid license · 公开 repo + free action
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # 如未来接入 org license 再启用
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # config 文件预留（当前为空 · false positive 出现后再加规则）
          # config-path: .gitleaks.toml
          # Phase 2 / Phase 3 不建 .gitleaks.toml（per SPIKE-06 A.5.3）
          # 先用 gitleaks 默认规则集
          version: "latest"

      # 可选：提交扫描报告为 artifact（便于 review · 仅 fail 时上传）
      - name: Upload gitleaks report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Guard · 防止 gitleaks:allow 内联绕过（Codex PR #11 F3）
  #
  # 背景：gitleaks 原生支持 `# gitleaks:allow` 行内标记忽略扫描。任何提交者
  # 都可借此让真实 secret 通过 CI · 等于后门。
  #
  # 修复：PR diff 中新增 `gitleaks:allow` 行 → fail，强制走 `.gitleaks.toml`
  # allowlist 路径（独立 PR · reviewer 审批）。
  # ─────────────────────────────────────────────────────────────────────
  gitleaks-bypass-guard:
    name: Guard · inline gitleaks:allow 检测
    runs-on: ubuntu-latest
    needs: gitleaks
    if: always()  # gitleaks job 跳过也要跑（否则可被 gitleaks bypass 绕过）
    timeout-minutes: 2
    steps:
      - name: Checkout (fetch full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect new inline `gitleaks:allow` or allowlist changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              # 新 branch 首次 push · 对 HEAD^ 做 best-effort diff
              BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
            fi
          else
            BASE="HEAD^"
            HEAD="HEAD"
          fi

          # 检测 1 · diff 中新增 `gitleaks:allow` 行（新增行以 `+` 开头）
          # 排除 workflow 文件自己 + 治理文档 · 这些文件文本中含 "gitleaks:allow"
          # 字符串是**禁止描述**（教育 / 规范用途）· 而非 bypass 尝试。
          # 用 `:(exclude)` pathspec 跳过这些文件的 diff · 真正的业务代码 / 样本
          # 文件如果出现 `gitleaks:allow` 会被检测到。
          NEW_INLINE=$(git diff "$BASE" "$HEAD" --diff-filter=AM -- \
            ':(exclude).github/workflows/secret-scan.yml' \
            ':(exclude)docs/BRANCH-PROTECTION.md' \
            ':(exclude)docs/tasks/SPIKE-06-cli-protocol-and-codesign.md' \
            ':(exclude)CONTRIBUTING.md' \
            | grep -E '^\+([^+]|$).*gitleaks:allow' \
            || true)

          # 检测 2 · `.gitleaksignore` 或 `.gitleaks.toml` 变更
          ALLOWLIST_CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^\.gitleaks(ignore|\.toml)$' \
            || true)

          if [ -n "$NEW_INLINE" ]; then
            echo "::error::Found new inline \`gitleaks:allow\` markers in this PR:"
            echo "$NEW_INLINE"
            echo ""
            echo "::error::Inline \`gitleaks:allow\` is a bypass path that any"
            echo "::error::committer can abuse · **banned** by SPIKE-06 A.5.3"
            echo "::error::(Codex PR #11 F3)."
            echo ""
            echo "处理 false positive 的正确路径："
            echo "  (a) 优先 · 修正真实脱敏（SPIKE-06 A.5.2）· 让 gitleaks 扫不到"
            echo "  (b) 可接受 · 创建 / 修改 .gitleaks.toml allowlist · 加最小范围 rule · 独立 PR · reviewer 审批"
            echo "  (c) 禁止 · 行内 gitleaks:allow"
            exit 1
          fi

          if [ -n "$ALLOWLIST_CHANGED" ]; then
            {
              echo "## ⚠️ gitleaks allowlist 变更"
              echo ""
              echo "本 PR 修改了 gitleaks allowlist 文件："
              echo '```'
              echo "$ALLOWLIST_CHANGED"
              echo '```'
              echo ""
              echo "**Reviewer 硬要求**："
              echo "- 核对新增 rule 的 scope 是否最小范围（不得整体 disable rule type）"
              echo "- 确认 rule 对应的 finding 是**真正**的 false positive（不是真 secret）"
              echo "- 检查是否已按 SPIKE-06 A.5.2 尝试脱敏（allowlist 应是最后手段）"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "✓ No inline gitleaks:allow bypasses detected."
          if [ -n "$ALLOWLIST_CHANGED" ]; then
            echo "  (allowlist changes flagged for reviewer · see job summary)"
          fi

# ─────────────────────────────────────────────────────────────────────
# 如何处理 false positive（**严格按 SPIKE-06 A.5.3**）
#
# 本 workflow 是 SPIKE-06 §A.5.3 硬阻塞的落地实现。关闭 = R1 样本泄漏风险。
#
# 正确处理路径（按优先级）：
#   1. **优先** · 修正脱敏（SPIKE-06 A.5.2）· 让 gitleaks 扫不到
#   2. **可接受** · 创建 / 修改 `.gitleaks.toml` allowlist 加**最小范围** rule ·
#      独立 PR · reviewer 审批（CODEOWNERS 覆盖 · Phase 5 后自动路由）
#   3. **严禁** · 行内 `# gitleaks:allow` 注释
#      · Codex PR #11 F3 教训 · 本 workflow 的 gitleaks-bypass-guard job 会
#        检测并 fail
#
# 紧急场景（CI 已阻塞但需要 hotfix）：
#   - 找 maintainer 临时 skip（GitHub 分支保护里 "Allow administrators to bypass"）
#   - merge 后立即补跑扫描 + 写 `docs/session-history/` 复盘
# ─────────────────────────────────────────────────────────────────────
