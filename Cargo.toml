[workspace]
resolver = "2"
members = ["crates/app", "crates/core"]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Vibestation Project"]
license = "Apache-2.0"
repository = "https://github.com/tajiaoyezi/vibestation"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2_sqlite = "0.24"
r2d2 = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
dunce = "1"
dirs = "6"
tempfile = "3"
ts-rs = "12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
