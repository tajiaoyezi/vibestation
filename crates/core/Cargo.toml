[package]
name = "vibestation-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Vibestation 业务核心逻辑（纯 Rust · 无 Tauri 依赖）"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
r2d2_sqlite.workspace = true
r2d2.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
dunce.workspace = true
ts-rs.workspace = true
# MVP-06 Phase A parser 依赖（Kimi PR #80）
toml = "0.8"
plist = "1.6"
serde_yaml = "0.9"
# MVP-04 Phase B PTY runtime 依赖（Codex PR #82 · SPIKE-05.5 架构）
crossbeam-channel = "0.5"
portable-pty = "0.9"
mio = { version = "1", features = ["os-ext", "os-poll"] }
libc = "0.2"
# MVP-07 Git Log 读路径依赖（OpenCode PR #83 · ADR-007 读切 gix）
gix = { version = "0.70", default-features = false, features = ["max-performance-safe", "revparse-regex"] }
git2 = "0.20"
similar = "2"
# MVP-08 Phase D Git Status fs watch（notify 6.x stable line）
notify = "6.1.1"

[dev-dependencies]
tempfile.workspace = true
criterion = "0.5"

[[bench]]
name = "workspace_query"
harness = false

[[bench]]
name = "git_status_bench"
harness = false

[[bench]]
name = "diff_bench"
harness = false

[[bench]]
name = "git_ops_bench"
harness = false
