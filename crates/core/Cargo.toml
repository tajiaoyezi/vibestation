[package]
name = "vibestation-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Vibestation 业务核心逻辑（纯 Rust · 无 Tauri 依赖）"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
r2d2_sqlite.workspace = true
r2d2.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
dunce.workspace = true
ts-rs.workspace = true
# MVP-06 Phase A parser 依赖（Kimi PR #80）
toml = "0.8"
plist = "1.9"
serde_yaml = "0.9"
# MVP-04 Phase B PTY runtime 依赖（Codex PR #82 · SPIKE-05.5 架构）
crossbeam-channel = "0.5"
portable-pty = "0.9"
mio = { version = "1", features = ["os-ext", "os-poll"] }
libc = "0.2"
# MVP-07 Git Log 读路径依赖（OpenCode PR #83 · ADR-007 读切 gix）
gix = { version = "0.70", default-features = false, features = ["max-performance-safe", "revparse-regex"] }
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
similar = "2"
# MVP-08 Phase D Git Status fs watch（notify 6.x stable line）
notify = "8.2.0"
# MVP-10 Phase B Telemetry · ADR-015 (Sentry SDK + sanitized payload)
# default-features = false 关闭 backtrace/contexts/panic 默认集成（ADR-015 §决策 · default_integrations=false 锁定）
# 仅保留 transport（reqwest + rustls · HTTP envelope 必需）
sentry = { version = "0.47", default-features = false, features = ["transport", "rustls"] }
# SHA-256 · panic message 哈希（不可逆 · 防 PII 泄漏）
sha2 = "0.11"

[dev-dependencies]
tempfile.workspace = true
criterion = "0.5"
# MVP-10 §C.3.1 PII unit test · IP 正则匹配
regex = "1"

