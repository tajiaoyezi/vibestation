<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vibestation mark">
  <defs>
    <linearGradient id="m-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(0.72 0.16 240)"/>
      <stop offset="100%" stop-color="oklch(0.58 0.20 260)"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile as workstation base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#m-grad)"/>
  <!-- Terminal prompt ">" + underscore cursor, stylized as a "station" node -->
  <g fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chevron -->
    <path d="M20 24 L28 32 L20 40"/>
    <!-- Underscore cursor -->
    <line x1="32" y1="42" x2="46" y2="42"/>
  </g>
  <!-- Tiny node dot — hints at "git node" / "workstation" -->
  <circle cx="46" cy="22" r="2.5" fill="white" opacity="0.9"/>
</svg>
