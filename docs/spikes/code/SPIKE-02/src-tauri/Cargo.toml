[package]
name = "spike-02-tauri"
version = "0.1.0"
description = "SPIKE-02 · Tauri hard-pass matrix (clipboard/fs/updater plugin smoke test)"
authors = ["Vibestation Project"]
edition = "2021"

[lib]
name = "spike_02_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
