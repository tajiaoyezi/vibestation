[package]
name = "spike-03-git-benchmark"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
git2 = "0.20"
gix = "0.70"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "git_read"
harness = false
