[package]
name = "spike-04-storage-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
redb = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
git2 = "0.20"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "git2_smoke"
harness = false