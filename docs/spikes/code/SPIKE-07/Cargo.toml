# SPIKE-07 原型 parser · 独立 crate（不进 workspace crates/ · 见 SPIKE-07 spec §C Don't.5）
# 空 [workspace] 表使本 crate 成为独立 workspace root · 不被根 Cargo.toml 吸收
[workspace]

[package]
name = "spike-07-parser"
version = "0.0.0"
edition = "2021"
publish = false
description = "SPIKE-07 CLI 输出协议 parser 验证原型（R1 降级前置 · 用完归档 · 不重写生产级）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "survey"
path = "src/bin/survey.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[profile.release]
opt-level = 2
